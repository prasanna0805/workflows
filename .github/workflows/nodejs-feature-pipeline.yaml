# read the evrsion

name: nodejs-feature-brand-workflow
on: 
  workflow_call: #here someone should call 
    inputs:
      project:
        description: 'project name'
        required: true
        type: string
      component:
        description: 'component name'
        required: true
        type: string
      
 

jobs:
  trigger:
    runs-on: self-hosted # github hosted runners
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: read package.json version
        id: package_version
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "VERSION=$APP_VERSION" >> $GITHUB_ENV
          #also avaialble as an environment variable in this step
          echo "Found version: $VERSION"
 
      - name: check app version
        run: echo "$APP_VERSION"

      - name: install dependencies
        run: npm install

      - name: unit tests
        id: unit-tests
        run: npm test

             
      - name: sonar scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}    # or https://sonarcloud.io

      - name: sonar quality gate check
        id: sonar_check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}    # optional


      - name: check dependabot alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with: 
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severrities: 'critical-high'
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'    
